#
# BroGRUB configuration
#

# Find Ubuntu partition
search --no-floppy --fs-uuid --set=root 51cb84cb-04f6-4cd9-ac01-92dc01169529

# Set GRUB directory
set prefix=($root)/boot/grub

# Load required modules
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod gfxterm_background

# Load custom fonts
source $prefix/fonts.cfg

# Select terminal font
set gfxterm_font="Bricolage Grotesque Regular 16"

# Set graphical terminal
terminal_output gfxterm

# Load original Ubuntu boot entries
source $prefix/grub.cfg

# BroGRUB display settings
set default=0
set timeout_style=menu
set timeout=-1

# Resolution
set gfxmode=1920x1080
set gfxpayload=keep

# Custom modules
insmod bg_change
insmod carousel

# Theme
set theme=/boot/grub/themes/customWorld/theme.txt
export theme

# Background
background_image /boot/grub/themes/customWorld/icons/starfield_blur.png

menuentry 'Windows Boot Manager' --class windows --class os {
    insmod part_gpt
    insmod fat
    insmod chain

    search --no-floppy --fs-uuid --set=root 1CCF-BE32

    chainloader --force /efi/Microsoft/Boot/bootmgfw.efi
}
