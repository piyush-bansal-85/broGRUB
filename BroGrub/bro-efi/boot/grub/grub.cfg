#
# BroGRUB configuration
#


set timeout=-1
set default=0

# resolution
set gfxmode=1920x1080
set gfxpayload=keep


# Graphics
source /boot/grub/fonts.cfg

insmod gfxterm
insmod gfxmenu

terminal_output gfxterm
set debug=carousel

set theme=/boot/grub/themes/customWorld/theme.txt
# set theme=/boot/grub/themes/starfield/theme.txt
export theme

background_image /boot/grub/themes/customWorld/icons/starfield_blur.png

# Ubuntu
menuentry "Ubuntu" --class ubuntu {
    linux /vmlinuz root=/dev/sda1
    initrd /initrd.img
}

# Windows
menuentry "Microsoft Windows" --class windows {
    chainloader +1
}

menuentry "UEFI settings" --class UEFI {
    chainloader +1
}